<!DOCTYPE html>

<head>

<body class="h-dvh bg-white font-sans w-full">

            <img src="/logo.png" class="w-24 mx-auto mb-5" alt="Logo">

            <h1 class="text-2xl font-bold mb-3">
                Open on Mobile
            </h1>

            <p class="text-gray-500">
                This application is available only on mobile devices.
            </p>
        </div>
    </div>

                        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                            <path d="M4 12L10 6M4 12L10 18M4 12H14.5M20 12H17.5" class="stroke-gray-400/70"
                                stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" />
                        </svg>
                    </div>
                    <a href="/" class="flex w-full items-center justify-center">
                        <div class="logo flex items-center justify-center h-full w-full cursor-pointer gap-2">

                            <div class="logo flex items-start justify-start cursor-pointer">
                                <img src="./src/images/logoo-300x300.png" alt="pi logo" class="h-6 w-6">

                            </div>
                        </div>
                    </a>
                    <div class="flex items-center justify-end w-full ">
                        <div id="subMenuView" class="cursor-pointer">

                                <svg width="24" height="24" viewBox="0 0 24 24" fill="none"
                                    xmlns="http://www.w3.org/2000/svg">
                                    <path d="M19 9L12 15L10.25 13.5M5 9L7.33333 11" stroke="currentColor"
                                        stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" />
                                </svg>
                            </span>
                        </div>
                    </div>
                </nav>
            </header>
        </div>

                        </a>

                    <!-- 9 -->
                    <div class="flex flex-col items-center justify-start w-fit">
                        <a href="/wallet" class="flex flex-col items-center justify-start w-fit">
                            <img src="./src/images/p-996x1024.png" alt="fireside" class="object-center h-16 w-16">
                            <small class="text-cenÍter">Profile</small>
